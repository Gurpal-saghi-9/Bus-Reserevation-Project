<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="500" xmlns="http://www.w3.org/2000/svg">
    <style>
        .actor {
            fill: #f8f9fa;
            stroke: #4361ee;
            stroke-width: 2;
        }
        .system {
            fill: #f8f9fa;
            stroke: #3a0ca3;
            stroke-width: 2;
        }
        .usecase {
            fill: #f8f9fa;
            stroke: #4cc9f0;
            stroke-width: 2;
        }
        .label {
            fill: #212529;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        .title {
            fill: #3a0ca3;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 16px;
        }
        .connection {
            stroke: #4361ee;
            stroke-width: 1.5;
            fill: none;
        }
    </style>
    
    <!-- System Boundary -->
    <rect x="200" y="60" width="300" height="380" rx="10" ry="10" class="system" fill-opacity="0.1" />
    <text x="350" y="85" text-anchor="middle" class="title">Bus Reservation System</text>
    
    <!-- Actors -->
    <!-- Admin Actor -->
    <circle cx="100" cy="150" r="20" class="actor" />
    <line x1="100" y1="170" x2="100" y2="210" class="connection" />
    <line x1="80" y1="190" x2="120" y2="190" class="connection" />
    <line x1="100" y1="210" x2="80" y2="240" class="connection" />
    <line x1="100" y1="210" x2="120" y2="240" class="connection" />
    <text x="100" y="270" text-anchor="middle" class="label">Admin/Operator</text>
    
    <!-- Passenger Actor -->
    <circle cx="600" cy="150" r="20" class="actor" />
    <line x1="600" y1="170" x2="600" y2="210" class="connection" />
    <line x1="580" y1="190" x2="620" y2="190" class="connection" />
    <line x1="600" y1="210" x2="580" y2="240" class="connection" />
    <line x1="600" y1="210" x2="620" y2="240" class="connection" />
    <text x="600" y="270" text-anchor="middle" class="label">Passenger</text>
    
    <!-- Use Cases -->
    <!-- Admin Use Cases -->
    <ellipse cx="250" cy="150" rx="80" ry="30" class="usecase" />
    <text x="250" y="155" text-anchor="middle" class="label">Add New Bus</text>
    
    <ellipse cx="250" cy="220" rx="80" ry="30" class="usecase" />
    <text x="250" y="225" text-anchor="middle" class="label">Update Bus Details</text>
    
    <ellipse cx="250" cy="290" rx="80" ry="30" class="usecase" />
    <text x="250" y="295" text-anchor="middle" class="label">View All Reservations</text>
    
    <!-- Shared Use Case -->
    <ellipse cx="350" cy="360" rx="80" ry="30" class="usecase" />
    <text x="350" y="365" text-anchor="middle" class="label">View Available Buses</text>
    
    <!-- Passenger Use Cases -->
    <ellipse cx="450" cy="150" rx="80" ry="30" class="usecase" />
    <text x="450" y="155" text-anchor="middle" class="label">Book Seats</text>
    
    <ellipse cx="450" cy="220" rx="80" ry="30" class="usecase" />
    <text x="450" y="225" text-anchor="middle" class="label">View Booking Details</text>
    
    <!-- Connections -->
    <!-- Admin to Use Cases -->
    <line x1="120" y1="150" x2="170" y2="150" class="connection" />
    <line x1="120" y1="170" x2="170" y2="220" class="connection" />
    <line x1="120" y1="190" x2="170" y2="290" class="connection" />
    <line x1="120" y1="210" x2="270" y2="360" class="connection" />
    
    <!-- Passenger to Use Cases -->
    <line x1="580" y1="150" x2="530" y2="150" class="connection" />
    <line x1="580" y1="170" x2="530" y2="220" class="connection" />
    <line x1="580" y1="190" x2="430" y2="360" class="connection" />
    
    <!-- Legend -->
    <rect x="50" y="420" width="600" height="60" rx="5" ry="5" fill="#f8f9fa" stroke="#4361ee" stroke-width="1" />
    <circle cx="80" cy="440" r="10" class="actor" />
    <text x="100" y="445" class="label">Actor</text>
    
    <ellipse cx="180" cy="440" rx="30" ry="15" class="usecase" />
    <text x="240" y="445" class="label">Use Case</text>
    
    <rect x="300" y="430" width="60" height="20" class="system" fill-opacity="0.1" />
    <text x="400" y="445" class="label">System Boundary</text>
    
    <line x1="460" y1="440" x2="500" y2="440" class="connection" />
    <text x="550" y="445" class="label">Association</text>
</svg>