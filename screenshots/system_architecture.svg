<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg">
    <style>
        .component {
            fill: #f8f9fa;
            stroke: #4361ee;
            stroke-width: 2;
        }
        .label {
            fill: #212529;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        .title {
            fill: #3a0ca3;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 16px;
        }
        .flow {
            stroke: #4361ee;
            stroke-width: 1.5;
            fill: none;
            marker-end: url(#arrowhead);
        }
        .bidirectional {
            stroke: #4361ee;
            stroke-width: 1.5;
            fill: none;
            marker-end: url(#arrowhead);
            marker-start: url(#arrowhead);
        }
    </style>
    
    <!-- Arrow marker definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#4361ee" />
        </marker>
    </defs>
    
    <text x="350" y="30" text-anchor="middle" class="title">Bus Reservation System Architecture</text>
    
    <!-- Client Component -->
    <rect x="100" y="100" width="150" height="100" rx="10" ry="10" class="component" />
    <text x="175" y="140" text-anchor="middle" class="title">Client</text>
    <text x="175" y="165" text-anchor="middle" class="label">(Browser)</text>
    
    <!-- Server Component -->
    <rect x="350" y="100" width="150" height="100" rx="10" ry="10" class="component" />
    <text x="425" y="140" text-anchor="middle" class="title">Server</text>
    <text x="425" y="165" text-anchor="middle" class="label">(Node.js + Express)</text>
    
    <!-- Data Store Component -->
    <rect x="600" y="100" width="150" height="100" rx="10" ry="10" class="component" />
    <text x="675" y="140" text-anchor="middle" class="title">Data Store</text>
    <text x="675" y="165" text-anchor="middle" class="label">(JSON)</text>
    
    <!-- Flows -->
    <line x1="250" y1="150" x2="350" y2="150" class="bidirectional" />
    <line x1="500" y1="150" x2="600" y2="150" class="bidirectional" />
    
    <!-- Component Details -->
    <!-- Client Details -->
    <rect x="75" y="250" width="200" height="120" rx="5" ry="5" stroke="#4cc9f0" stroke-width="1" fill="#f8f9fa" fill-opacity="0.6" />
    <text x="175" y="270" text-anchor="middle" class="title">Client Components</text>
    <text x="85" y="290" class="label">• HTML/CSS for UI</text>
    <text x="85" y="310" class="label">• JavaScript for client logic</text>
    <text x="85" y="330" class="label">• AJAX for API communication</text>
    <text x="85" y="350" class="label">• DOM manipulation</text>
    
    <!-- Server Details -->
    <rect x="325" y="250" width="200" height="120" rx="5" ry="5" stroke="#4cc9f0" stroke-width="1" fill="#f8f9fa" fill-opacity="0.6" />
    <text x="425" y="270" text-anchor="middle" class="title">Server Components</text>
    <text x="335" y="290" class="label">• Express.js framework</text>
    <text x="335" y="310" class="label">• REST API endpoints</text>
    <text x="335" y="330" class="label">• Request handling</text>
    <text x="335" y="350" class="label">• Business logic</text>
    
    <!-- Data Store Details -->
    <rect x="575" y="250" width="200" height="120" rx="5" ry="5" stroke="#4cc9f0" stroke-width="1" fill="#f8f9fa" fill-opacity="0.6" />
    <text x="675" y="270" text-anchor="middle" class="title">Data Store Components</text>
    <text x="585" y="290" class="label">• JSON file structure</text>
    <text x="585" y="310" class="label">• Bus records</text>
    <text x="585" y="330" class="label">• Seat allocation data</text>
    <text x="585" y="350" class="label">• Filesystem operations</text>
</svg>